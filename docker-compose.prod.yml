# Production-mode local stack: the same image, config checks, and restricted DB
# role as the AWS deployment (DEPLOY.md), running on this machine. Real data lives
# here — the dev stack in docker-compose.yml (port 5433) is for development only.
#
# Manage it with the scripts in scripts/local-prod/ (they pass --env-file):
#   scripts/local-prod/init-env.sh   # once: generates .env.production with secrets
#   scripts/local-prod/deploy.sh     # build, migrate, (re)start
name: doric-local

services:
  db:
    image: postgres:16-alpine
    container_name: doric_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: doric_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/local-prod/init-env.sh}
      POSTGRES_DB: doric
    ports:
      # Loopback only — reachable from this machine, not the LAN.
      - "127.0.0.1:5434:5432"
    volumes:
      - doric_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doric_admin -d doric"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: doric:local
    container_name: doric_local_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Privileged role: migrations and setupDbRole only.
      DATABASE_URL: postgresql://doric_admin:${POSTGRES_PASSWORD}@db:5432/doric
      # Restricted role the server runs as, so row-level security is enforced.
      APP_DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/doric
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?run scripts/local-prod/init-env.sh}
      APP_BASE_URL: http://localhost:4100
      # Plain http on localhost, no proxy in front. On AWS both are on (the defaults).
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      # SimpleFIN servers the app may contact (default: SimpleFIN Bridge only).
      SIMPLEFIN_ALLOWED_HOSTS: ${SIMPLEFIN_ALLOWED_HOSTS:-bridge.simplefin.org,beta-bridge.simplefin.org}
      # Shown on the Privacy page as the contact for questions and data deletion.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Outgoing email for password reset links (off unless SMTP_HOST and MAIL_FROM are set).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:4100:4000"

  # Nightly pg_dump to a host folder (on the Windows side by default), pruned after
  # BACKUP_KEEP_DAYS. Every 15 minutes it checks whether the newest scheduled dump is
  # over 24 hours old (or missing) and takes one if so, so sleep, restarts, and
  # missed nights catch up instead of resetting a 24-hour timer. The script is inline
  # (no file mounted from WSL), so it starts even if Docker comes up before WSL does.
  # ($$ escapes $ from compose interpolation.)
  backup:
    image: postgres:16-alpine
    container_name: doric_local_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: doric_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: doric
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:?set BACKUP_DIR in .env.production}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        echo "$$(date -u +%FT%TZ) backup scheduler started (checks every 15 minutes)"
        while true; do
          # Scheduled dumps end in Z.dump; manual ones end in -manual.dump.
          latest=$$(ls -1t /backups/doric-*Z.dump 2>/dev/null | head -1)
          if [ -z "$$latest" ] || [ -z "$$(find "$$latest" -mmin -1440 2>/dev/null)" ]; then
            f="/backups/doric-$$(date -u +%Y%m%dT%H%M%SZ).dump"
            if pg_dump -Fc -f "$$f.partial"; then
              mv "$$f.partial" "$$f"
              echo "$$(date -u +%FT%TZ) backup ok: $$f ($$(du -h "$$f" | cut -f1))"
            else
              rm -f "$$f.partial"
              echo "$$(date -u +%FT%TZ) backup FAILED; retrying in 15 minutes" >&2
            fi
            find /backups -name 'doric-*.dump' -mtime +"$$KEEP_DAYS" -delete
          fi
          sleep 900
        done

  # Off-machine copies of the backups, to any S3-compatible bucket (OCI Object Storage's
  # S3 API, Amazon S3, Backblaze B2, MinIO, …). Optional: started only with the
  # "offsite" profile (deploy.sh adds it when OFFSITE_BUCKET is set). Every hour it
  # copies new dumps from BACKUP_DIR to OFFSITE_BUCKET/OFFSITE_PREFIX and deletes copies
  # older than BACKUP_KEEP_DAYS, so the bucket mirrors the local retention.
  offsite:
    image: rclone/rclone:1.71
    container_name: doric_local_offsite
    restart: unless-stopped
    profiles: ["offsite"]
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
      DEST: offsite:${OFFSITE_BUCKET:-unset}/${OFFSITE_PREFIX:-doric}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:?set BACKUP_DIR in .env.production}:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$(date -u +%FT%TZ) offsite copier started: /backups -> $$DEST (every hour)"
        while true; do
          # --min-age skips a dump still being written; --max-age skips ones past retention.
          if rclone copy /backups "$$DEST" --include 'doric-*.dump' --min-age 2m --max-age "$${KEEP_DAYS}d" --no-traverse --log-level NOTICE; then
            echo "$$(date -u +%FT%TZ) offsite copy ok ($$(rclone lsf "$$DEST" --include 'doric-*.dump' | wc -l) dumps in the bucket)"
            rclone delete "$$DEST" --include 'doric-*.dump' --min-age "$${KEEP_DAYS}d" --log-level NOTICE || true
          else
            echo "$$(date -u +%FT%TZ) offsite copy FAILED; retrying in 1 hour" >&2
          fi
          sleep 3600
        done

volumes:
  doric_local_pgdata:
