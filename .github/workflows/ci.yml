name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests + coverage (≥90%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test harness defaults to this URL; the test DB (finance_test) is
      # created by test/prepare-db.ts against the same server.
      TEST_DATABASE_URL: postgresql://finance:finance@localhost:5433/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Test with coverage gate
        working-directory: server
        run: npm run test:coverage:gate

  web:
    name: Web tests + coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test with coverage gate
        working-directory: web
        run: npm run test:coverage:gate
