name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests + coverage (≥90%)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test harness defaults to this URL; the test DB (finance_test) is
      # created by test/prepare-db.ts against the same server.
      TEST_DATABASE_URL: postgresql://finance:finance@localhost:5433/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        working-directory: server
        run: npm ci
      - name: Production build
        working-directory: server
        run: npm run build
      - name: Test with coverage gate
        working-directory: server
        run: npm run test:coverage:gate
      # Again as a restricted (non-superuser, NOBYPASSRLS) role, like production, so
      # row-level security is enforced; the privileged run can't catch a missing
      # tenant context (prepare-db creates the role).
      - name: Test under a restricted database role
        working-directory: server
        run: TEST_RESTRICTED_ROLE=1 npm run test:integration
      - name: Dependency audit (production)
        working-directory: server
        run: npm audit --omit=dev --audit-level=moderate

  web:
    name: Web tests + coverage (≥90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test with coverage gate
        working-directory: web
        run: npm run test:coverage:gate
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Dependency audit (production)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
